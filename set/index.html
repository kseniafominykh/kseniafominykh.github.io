<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SET переехал</title>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (/\/set\/$/.test(r.scope)) r.unregister(); }); });
  location.replace('/set-app/' + location.hash);
</script>
</head>
<body style="font-family:system-ui,sans-serif;padding:40px 24px;background:#F7F6F4;color:#1A1A22">
  <p>SET переехал — <a href="/set-app/">открыть новую версию</a>.</p>
</body>
</html>
